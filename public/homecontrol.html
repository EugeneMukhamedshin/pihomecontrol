<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
    <title>Отопление</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #101828;
            --muted: #667085;
            --line: #e4e7ec;
            --accent: #2563eb;
            --accent-weak: #eef4ff;
            --ok: #12b76a;
            --ok-weak: #e8f8f0;
            --off: #98a2b3;
            --danger: #f04438;
            --danger-weak: #fef0ef;
            --warn: #b54708;
            --warn-weak: #fff4e5;
            --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .06);
            --radius: 18px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b1220;
                --card: #111a2c;
                --text: #e6edf7;
                --muted: #94a3b8;
                --line: #22304a;
                --accent: #60a5fa;
                --accent-weak: #14233d;
                --ok: #34d399;
                --ok-weak: #0f2a22;
                --off: #64748b;
                --danger: #f87171;
                --danger-weak: #2a1517;
                --warn: #fbbf24;
                --warn-weak: #2a2110;
                --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
            }
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        .wrap {
            max-width: 640px;
            margin: 0 auto;
            padding: 16px 16px calc(28px + env(safe-area-inset-bottom));
        }

        /* Шапка */

        .topbar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin: 4px 2px 16px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -.02em;
        }

        .sub {
            color: var(--muted);
            font-size: 13px;
            margin-top: 2px;
        }

        .conn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 11px;
            border-radius: 999px;
            background: var(--card);
            border: 1px solid var(--line);
            font-size: 13px;
            color: var(--muted);
            white-space: nowrap;
        }

        .conn .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--off);
            transition: background .2s;
        }

        .conn.is-online .dot {
            background: var(--ok);
        }

        .conn.is-offline {
            color: var(--danger);
        }

        .conn.is-offline .dot {
            background: var(--danger);
        }

        .topbar-side {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .logout-form {
            margin: 0;
        }

        .logout {
            padding: 2px 4px;
            border: 0;
            background: none;
            color: var(--muted);
            font: inherit;
            font-size: 12.5px;
            text-decoration: underline;
            cursor: pointer;
            touch-action: manipulation;
        }

        .logout:active {
            color: var(--text);
        }

        /* Карточки */

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px;
            margin-bottom: 14px;
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        h2 {
            margin: 0;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--muted);
        }

        /* Главная карточка */

        .hero {
            padding-top: 22px;
            text-align: center;
        }

        .hero-temp {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 6px;
            font-variant-numeric: tabular-nums;
        }

        #currentTemp {
            font-size: clamp(58px, 17vw, 80px);
            font-weight: 700;
            letter-spacing: -.04em;
            line-height: 1;
        }

        .hero-temp .unit {
            font-size: 24px;
            font-weight: 600;
            color: var(--muted);
        }

        .hero-sub {
            margin-top: 6px;
            color: var(--muted);
            font-size: 14px;
        }

        .setpoint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-top: 20px;
        }

        .step {
            width: 62px;
            height: 62px;
            border: 0;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 32px;
            font-weight: 500;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, .28);
            transition: transform .06s, filter .15s;
            touch-action: manipulation;
        }

        .step:active {
            transform: scale(.94);
            filter: brightness(.95);
        }

        #autoTempInput {
            width: 128px;
            padding: 10px 4px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--accent-weak);
            color: var(--text);
            font: inherit;
            font-size: 34px;
            font-weight: 700;
            text-align: center;
            font-variant-numeric: tabular-nums;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        #autoTempInput::-webkit-outer-spin-button,
        #autoTempInput::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #autoTempInput:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-weak);
        }

        .hint {
            color: var(--muted);
            font-size: 13px;
            margin-top: 8px;
        }

        /* Датчики */

        .pills {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
        }

        .pill {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            padding: 11px 13px;
            border: 1.5px solid var(--line);
            border-radius: 13px;
            background: transparent;
            color: var(--text);
            font: inherit;
            text-align: left;
            cursor: pointer;
            transition: border-color .15s, background .15s;
            touch-action: manipulation;
        }

        .pill:active {
            transform: scale(.99);
        }

        .pill .pill-name {
            font-size: 12.5px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .pill .pill-value {
            font-size: 19px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .pill.is-selected {
            border-color: var(--accent);
            background: var(--accent-weak);
        }

        .pill.is-selected .pill-name {
            color: var(--accent);
            font-weight: 600;
        }

        .sensor-list {
            display: flex;
            flex-wrap: wrap;
            column-gap: 14px;
            row-gap: 2px;
            margin-top: 10px;
            color: var(--muted);
            font-size: 13.5px;
            line-height: 1.7;
        }

        .sensor-list span {
            white-space: nowrap;
        }

        .sensor-list .is-selected {
            color: var(--accent);
            font-weight: 600;
        }

        /* Устройства */

        .device-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 13px 0;
            border-top: 1px solid var(--line);
        }

        .device-row:first-of-type {
            border-top: 0;
        }

        .device-name {
            font-size: 16px;
            font-weight: 600;
        }

        .device-state {
            margin-top: 2px;
            font-size: 13px;
            color: var(--muted);
        }

        .device-state .bad {
            color: var(--warn);
        }

        .device-btn {
            min-width: 132px;
            min-height: 48px;
            padding: 0 18px;
            border: 0;
            border-radius: 13px;
            background: var(--ok);
            color: #06281c;
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .06s, filter .15s;
            touch-action: manipulation;
        }

        .device-btn:active {
            transform: scale(.97);
            filter: brightness(.96);
        }

        .device-btn.is-off {
            background: var(--danger);
            color: #fff;
        }

        .device-btn:disabled {
            opacity: .55;
            cursor: default;
        }

        .notice {
            display: none;
            margin: 0 0 12px;
            padding: 10px 12px;
            border-radius: 11px;
            background: var(--warn-weak);
            color: var(--warn);
            font-size: 13px;
        }

        .notice.is-visible {
            display: block;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Тост */

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(20px + env(safe-area-inset-bottom));
            transform: translate(-50%, 16px);
            max-width: min(92vw, 420px);
            padding: 12px 18px;
            border-radius: 12px;
            background: #1d2939;
            color: #fff;
            font-size: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s;
            z-index: 10;
        }

        .toast.is-visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (min-width: 560px) {
            .card {
                padding: 22px;
            }

            .pills {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="topbar">
            <div>
                <h1>Отопление</h1>
                <div class="sub" id="updated">загрузка…</div>
            </div>
            <div class="topbar-side">
                <div class="conn" id="conn" aria-live="polite">
                    <span class="dot"></span>
                    <span id="connText">связь…</span>
                </div>
                <form method="POST" action="/logout" class="logout-form">
                    <button type="submit" class="logout">Выйти</button>
                </form>
            </div>
        </header>

        <section class="card hero">
            <div class="hero-temp">
                <span id="currentTemp">—</span><span class="unit">°C</span>
            </div>
            <div class="hero-sub" id="heroSub">выберите датчик</div>

            <div class="setpoint">
                <button type="button" class="step" id="tempDown" aria-label="Уменьшить целевую температуру">−</button>
                <label class="sr-only" for="autoTempInput">Целевая температура, °C</label>
                <input id="autoTempInput" type="number" step="0.5" min="5" max="40" inputmode="decimal" value="22">
                <button type="button" class="step" id="tempUp" aria-label="Увеличить целевую температуру">+</button>
            </div>
            <div class="hint">поддерживать, °C</div>
        </section>

        <section class="card">
            <div class="card-head">
                <h2>Датчик температуры</h2>
            </div>
            <div class="pills" id="sensorPills"></div>
            <div class="sensor-list" id="sensorList"></div>
        </section>

        <section class="card">
            <div class="card-head">
                <h2>Устройства</h2>
            </div>
            <p class="notice" id="dryRunNote"></p>

            <div id="devicesContainer"></div>
        </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        (function () {
            "use strict";

            var socket = io();

            // Сессия могла истечь или cookie удалили: сервер не пустит сокет,
            // поэтому возвращаемся на страницу входа.
            function redirectIfUnauthorized(reason) {
                if (reason && reason.code === "E_UNAUTHORIZED") {
                    window.location.href = "/login";
                }
            }

            socket.on("error", redirectIfUnauthorized);
            socket.on("connect_error", redirectIfUnauthorized);

            // Нагревом можно управлять только по комнатным датчикам:
            // улица, кессон и труба для этого не годятся.
            var SELECTABLE_SENSORS = [0, 1];
            var state = {
                sensors: [],
                selected: 0,
                autoTemp: 22,
                devices: [],
                lastDataAt: 0,
                pendingSourceUntil: 0,
                pendingTempUntil: 0
            };

            var el = {
                currentTemp: document.getElementById("currentTemp"),
                heroSub: document.getElementById("heroSub"),
                updated: document.getElementById("updated"),
                conn: document.getElementById("conn"),
                connText: document.getElementById("connText"),
                pills: document.getElementById("sensorPills"),
                sensorList: document.getElementById("sensorList"),
                autoTemp: document.getElementById("autoTempInput"),
                tempUp: document.getElementById("tempUp"),
                tempDown: document.getElementById("tempDown"),
                devices: document.getElementById("devicesContainer"),
                dryRunNote: document.getElementById("dryRunNote"),
                toast: document.getElementById("toast")
            };

            var toastTimer = null;

            function toast(message) {
                el.toast.textContent = message;
                el.toast.classList.add("is-visible");
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function () {
                    el.toast.classList.remove("is-visible");
                }, 2600);
            }

            function formatTemp(value) {
                if (typeof value !== "number" || !isFinite(value)) {
                    return "—";
                }
                return value.toFixed(1).replace(".", ",");
            }

            function sensorName(index) {
                var sensor = state.sensors[index];
                return sensor ? sensor.name : "датчик";
            }

            function heaterDevice() {
                for (var i = 0; i < state.devices.length; i++) {
                    if (state.devices[i].id === "heater") {
                        return state.devices[i];
                    }
                }
                return null;
            }

            function renderHero() {
                var sensor = state.sensors[state.selected];
                el.currentTemp.textContent = formatTemp(sensor ? sensor.value : NaN);

                var heater = heaterDevice();
                var heaterText = "нагрев —";
                if (heater) {
                    heaterText = heater.on ? "нагрев включён" : "нагрев выключен";
                    if (heater.feedback !== null && heater.feedback !== undefined && heater.feedback !== heater.on) {
                        heaterText += heater.on ? ", пускатель не подтверждает" : ", пускатель замкнут";
                    }
                }
                el.heroSub.textContent = sensorName(state.selected) + " · " + heaterText;

                if (document.activeElement !== el.autoTemp) {
                    // number-инпуты не принимают запятую — only dot
                    el.autoTemp.value = String(state.autoTemp);
                }
            }

            function renderPills() {
                el.pills.textContent = "";
                el.sensorList.textContent = "";

                state.sensors.forEach(function (sensor, index) {
                    if (SELECTABLE_SENSORS.indexOf(index) === -1) {
                        var info = document.createElement("span");
                        info.textContent = sensor.name + " " + formatTemp(sensor.value) + " °C";
                        if (index === state.selected) {
                            info.className = "is-selected";
                        }
                        el.sensorList.appendChild(info);
                        return;
                    }

                    var pill = document.createElement("button");
                    pill.type = "button";
                    pill.className = "pill" + (index === state.selected ? " is-selected" : "");
                    pill.setAttribute("aria-pressed", index === state.selected ? "true" : "false");

                    var name = document.createElement("span");
                    name.className = "pill-name";
                    name.textContent = sensor.name;

                    var value = document.createElement("span");
                    value.className = "pill-value";
                    value.textContent = formatTemp(sensor.value) + " °C";

                    pill.appendChild(name);
                    pill.appendChild(value);
                    pill.addEventListener("click", function () {
                        selectSensor(index);
                    });
                    el.pills.appendChild(pill);
                });
            }

            function renderDevices() {
                el.devices.textContent = "";
                state.devices.forEach(function (device) {
                    var row = document.createElement("div");
                    row.className = "device-row";

                    var info = document.createElement("div");

                    var name = document.createElement("div");
                    name.className = "device-name";
                    name.textContent = device.title;

                    var status = document.createElement("div");
                    status.className = "device-state";
                    status.textContent = device.on ? "включён" : "выключен";
                    if (device.feedback !== null && device.feedback !== undefined && device.feedback !== device.on) {
                        var warning = document.createElement("span");
                        warning.className = "bad";
                        warning.textContent = " · нет подтверждения";
                        status.appendChild(warning);
                    }

                    info.appendChild(name);
                    info.appendChild(status);

                    var button = document.createElement("button");
                    button.type = "button";
                    button.className = "device-btn" + (device.on ? " is-off" : "");
                    button.textContent = device.on ? "Выключить" : "Включить";
                    button.addEventListener("click", function () {
                        button.disabled = true;
                        button.textContent = "…";
                        socket.emit("switch", { id: device.id, on: !device.on }, function (reply) {
                            if (!reply || !reply.ok) {
                                button.disabled = false;
                                button.textContent = device.on ? "Выключить" : "Включить";
                                toast((reply && reply.message) || "Команда не выполнена");
                                return;
                            }
                            if (reply.devices && reply.devices.devices) {
                                state.devices = reply.devices.devices;
                                renderDevices();
                                renderDryRun();
                            }
                        });
                    });

                    row.appendChild(info);
                    row.appendChild(button);
                    el.devices.appendChild(row);
                });

                renderHero();
            }

            function renderDryRun() {
                var titles = [];
                state.devices.forEach(function (device) {
                    if (device.dryRun) {
                        titles.push(device.title);
                    }
                });
                el.dryRunNote.classList.toggle("is-visible", titles.length > 0);
                el.dryRunNote.textContent = titles.length
                    ? "Тестовый режим: GPIO не управляются — " + titles.join(", ")
                    : "";
            }

            function selectSensor(index) {
                state.selected = index;
                state.pendingSourceUntil = Date.now() + 1200;
                renderPills();
                renderHero();
                socket.emit("autoTempSourceIndex", index);
            }

            function clampTemp(value) {
                if (!isFinite(value)) {
                    return state.autoTemp;
                }
                value = Math.round(value * 2) / 2;
                return Math.max(5, Math.min(40, value));
            }

            function applyTemp(value, silent) {
                var next = clampTemp(value);
                state.autoTemp = next;
                state.pendingTempUntil = Date.now() + 1200;
                el.autoTemp.value = String(next);
                renderHero();
                if (!silent) {
                    socket.emit("autoTemp", next);
                }
            }

            function stepTemp(delta) {
                var current = parseFloat(String(el.autoTemp.value).replace(",", "."));
                applyTemp((isFinite(current) ? current : state.autoTemp) + delta, false);
            }

            el.tempUp.addEventListener("click", function () {
                stepTemp(0.5);
            });

            el.tempDown.addEventListener("click", function () {
                stepTemp(-0.5);
            });

            el.autoTemp.addEventListener("change", function () {
                applyTemp(parseFloat(String(this.value).replace(",", ".")), false);
            });

            el.autoTemp.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    this.blur();
                }
            });

            socket.on("connect", function () {
                el.conn.classList.remove("is-offline");
                el.conn.classList.add("is-online");
                el.connText.textContent = "онлайн";
                socket.emit("getDevices", function (snapshot) {
                    if (snapshot) {
                        state.devices = snapshot.devices || [];
                        renderDevices();
                        renderDryRun();
                    }
                });
            });

            socket.on("disconnect", function () {
                el.conn.classList.remove("is-online");
                el.conn.classList.add("is-offline");
                el.connText.textContent = "нет связи";
            });

            socket.on("tempSensors", function (sensors) {
                if (!Array.isArray(sensors)) {
                    return;
                }
                state.sensors = sensors;
                state.lastDataAt = Date.now();
                renderPills();
                renderHero();
            });

            socket.on("autoTemp", function (value) {
                var next = parseFloat(value);
                if (!isFinite(next)) {
                    return;
                }
                if (Date.now() < state.pendingTempUntil) {
                    return;
                }
                state.autoTemp = next;
                renderHero();
            });

            socket.on("autoTempSourceIndex", function (index) {
                var next = parseInt(index, 10);
                if (!Number.isInteger(next) || next < 0 || next >= state.sensors.length) {
                    return;
                }
                if (Date.now() < state.pendingSourceUntil) {
                    return;
                }
                state.selected = next;
                renderPills();
                renderHero();
            });

            socket.on("devices", function (snapshot) {
                if (!snapshot) {
                    return;
                }
                state.devices = snapshot.devices || [];
                renderDevices();
                renderDryRun();
            });

            setInterval(function () {
                if (!state.lastDataAt) {
                    return;
                }
                var seconds = Math.round((Date.now() - state.lastDataAt) / 1000);
                if (seconds > 25) {
                    el.updated.textContent = "нет свежих данных";
                } else if (seconds < 2) {
                    el.updated.textContent = "обновлено только что";
                } else {
                    el.updated.textContent = "обновлено " + seconds + " с назад";
                }
            }, 3000);

            renderHero();
        })();
    </script>
</body>
</html>
